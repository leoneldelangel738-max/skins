<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skin Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1>SORA</h1>
    </header>

    <main>

        <section class="skins-section">
            <h2>DEFAULT SKINS</h2>

            <div class="skins-grid" id="defaultSkins">
                <!-- Las skins aparecerán aquí -->
            </div>
        </section>


        <section class="skins-section">
            <h2>CUSTOM SKINS</h2>

            <div class="skins-grid" id="customSkins">
                <!-- Las skins aparecerán aquí -->
            </div>
        </section>


        <section class="preview-section">

            <h2>PREVIEW</h2>

            <div class="preview-container">
                <p id="previewText">
                    Selecciona una skin
                </p>

                <img
                    id="previewImage"
                    src=""
                    alt="Preview de la skin"
                >
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
